name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  audit-dependances:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  schema-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: guardpay
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci -d guardpay" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in warehouse/sql/*.sql; do
            psql "postgresql://ci:ci@localhost:5432/guardpay" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "postgresql://ci:ci@localhost:5432/guardpay" -v ON_ERROR_STOP=1 -c "select count(*) from gold.variables_operation"

  compose-et-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile streaming --profile batch config -q
      - run: docker build -f infra/Dockerfile.pipeline -t guardpay-pipeline:ci .
      - run: docker run --rm guardpay-pipeline:ci -c "import pandas, pyarrow, yaml, scipy, psycopg; print('ok')"
