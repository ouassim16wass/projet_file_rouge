name: controle-donnees

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrats:
    name: 1 Contrats de donnees
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python qualite/verifier_contrats.py

  qualite-cartes:
    name: 2 Qualite du jeu ULB
    needs: contrats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python ingestion/telecharger_donnees.py creditcard
      - run: python qualite/nettoyer.py creditcard
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-qualite-cartes
          path: |
            docs/rapport_qualite_cartes.md
            data/processed/rapport_qualite_cartes.json
          retention-days: 30
