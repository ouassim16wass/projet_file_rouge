regles_table:
  - id: C20
    nom: unicite_ligne_complete
    type: unicite
    champs: [temps, v1, v2, v3, v4, v5, v6, v7, v8, v9, v10, v11, v12, v13, v14, v15, v16, v17, v18, v19, v20, v21, v22, v23, v24, v25, v26, v27, v28, montant, classe]
    severite: erreur
    message: "transaction strictement identique a une autre, 1081 doublons dont 19 fraudes, ecartes pour eviter toute fuite entre apprentissage et test"
  - {id: C21, nom: unicite_id_transaction, type: unicite, champs: [id_transaction], severite: erreur}

qualite_globale:
  taux_rejet_max: 0.01
  actions:
    erreur: ligne ecartee vers la quarantaine avec la liste des regles violees
    avertissement: ligne conservee, drapeau ajoute dans la colonne controles_qualite
