contrat:
  id: guardpay.transactions_cartes
  version: 1.0.0
  statut: actif
  jeu_de_donnees: D09 creditcard_ulb
  description: Transactions par carte reelles et anonymisees, utilisees pour valider le modele de detection.
  proprietaire: equipe-donnees-guardpay
  consommateurs: [ml-entrainement, ml-evaluation]
  source:
    nom: Fraude carte ULB
    url: https://openml.org/data/v1/download/1673544/creditcard.arff
    origine: ULB Machine Learning Group
    licence: a verifier a la source d'origine
    nature: donnees reelles anonymisees, variables PCA
  fraicheur:
    livraison: statique, deux jours de septembre 2013
  volumetrie:
    lignes_attendues: 284807
  retention: duree du projet
  evolution:
    compatibilite: jeu statique, tout changement de schema = nouvelle version majeure
    notification: revue du contrat avant tout changement de schema

entree:
  fichier: data/raw/creditcard.arff
  format: arff
  cle: id_transaction
  cible: classe
  silver: data/processed/silver/transactions_cartes.parquet
  quarantaine: data/processed/quarantaine/transactions_cartes_rejetees.parquet
  rapport_json: data/processed/rapport_qualite_cartes.json
  rapport_md: docs/rapport_qualite_cartes.md

champs:
  - nom: id_transaction
    source: genere
    type: entier
    obligatoire: true
    unique: true
    description: Numero de ligne du fichier source, cle technique ajoutee a l'ingestion.
    classification: technique
    regles:
      - {id: C01, type: minimum, valeur: 1, severite: erreur}

  - nom: temps
    source: Time
    type: decimal
    obligatoire: true
    unite: secondes depuis la premiere transaction
    description: Delai ecoule depuis la premiere transaction du jeu, sur deux jours.
    classification: technique
    regles:
      - {id: C02, type: plage, min: 0, max: 172792, severite: erreur}

  - nom: v1
    source: V1
    type: decimal
    obligatoire: true
    description: Composante principale 1 issue d'une analyse en composantes principales, anonymisee par la source.
    classification: variable_pca

