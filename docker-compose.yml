services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: guardpay-kafka
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: guardpay-postgres
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: guardpay-mongodb
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?definir dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?definir dans .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: guardpay-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in operations.brutes operations.rejetees alertes; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"

  spark-bronze:
    image: apache/spark:3.5.3-python3
    container_name: guardpay-spark-bronze
    mem_limit: 2g
    cpus: 2.0
    profiles: ["streaming"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    user: root
    working_dir: /app
    environment:
      KAFKA_SERVEUR: kafka:29092
    volumes:
      - ./streaming:/app:ro
      - ./data/processed:/donnees
      - spark_ivy:/root/.ivy2
    command: ["/opt/spark/bin/spark-submit", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3", "--conf", "spark.jars.ivy=/root/.ivy2", "/app/bronze.py"]

  pipeline:
    build:
      context: .
      dockerfile: infra/Dockerfile.pipeline
    image: guardpay-pipeline:local
    container_name: guardpay-pipeline
    profiles: ["batch"]
    mem_limit: 6g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs

volumes:
  spark_ivy:
  kafka_data:
  postgres_data:
  mongo_data:
